# fly.toml app configuration file generated for omni-glasses on 2026-10-25T00:13:32-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'omni-glasses'
primary_region = 'ord'

[build]
  dockerfile = 'cloud/Dockerfile'

[env]
  CAPTIONS_DAILY_MINUTES = '120'
  DATA_DIR = '/data'

[[mounts]]
  source = 'omni_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
