# DEV MODE ONLY: python -m backend.main --dev
#
# Merged on top of config.yaml so we can develop before the ESP32-CAMs and the FPGA
# arrive. Nothing here is part of the product.
#
#   EYE    laptop webcam + MediaPipe face mesh (whole face, not one eye up close)
#   FRONT  laptop webcam too (shares the reader); distance from your face width.
#          --front synthetic-front: scripted phone / laptop / heads-up / outdoor loop
#          --front sample:bus.jpg (or any .jpg/.png/.mp4) for "what am I looking at?"
#   REAR   FPGA events from tools/mock_fpga.py: run it in another terminal, or pass --mock-fpga
#          (or --rear-mode software --rear synthetic for the old in-laptop lgmd.py path)
#
# To try the product's close-up eye method with no eye camera: --eye synthetic-eye --eye-method closeup
#
# Sources: webcam index, MJPEG URL (mock_glasses.py serves :81/stream), video file (looped),
# image file (repeated), "sample:<name>" (images bundled with ultralytics: bus.jpg, zidane.jpg),
# or "synthetic".

cameras:
  eye:
    source: 0
  front:
    source: 0

eye:
  method: facemesh        # DEV ONLY stand-in for the close-up eye camera
  facemesh_eye: left      # measure only the wearer's LEFT eye, like the real eye camera
  default_baseline: 0.28  # typical open-eye EAR

gaze:
  front_mirrored: true    # the webcam faces you: its picture is a mirror image of your view
  default_centroids:      # uncalibrated: a webcam facing you sees your iris move to the
    left: [0.25, 0.0]     # picture's right when you look left (the real eye camera's
    center: [0.0, 0.0]    # direction depends on its mount: calibrate on the glasses)
    right: [-0.25, 0.0]

distance:
  method: face            # DEV ONLY: the webcam looks at you, not at a screen

rear:
  mode: fpga              # events from tools/mock_fpga.py (UDP 4300)
