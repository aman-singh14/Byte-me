# Mega Glasses backend config. When the ESP32-CAMs arrive, only this file changes.
#
# A camera "source" can be:
#   0, 1, ...                       local webcam index
#   "http://front-cam.local:81/stream"   ESP32-CAM MJPEG stream (or mock_glasses.py at :81)
#   "clips/me_blinking.mp4"         a video file, looped
#   "synthetic"                     lgmd.py's looming square on a loop (rear alert fires every ~4.5 s)
# "fallback" is used while the primary source is down; the primary is retried every reconnect_s.
# Cameras with the same source share one reader, so eye + front can both use webcam 0.

cameras:
  eye:
    source: 0
    fallback: null
  front:
    source: 0
    fallback: null
  rear:
    source: synthetic
    fallback: null

stream:
  reconnect_s: 3.0        # retry a dead source this often
  stale_s: 2.0            # no new frame for this long = source is down
  width: 640              # requested capture size (webcams only; ESP32 size is set in firmware)
  height: 480

pipelines:
  fps: 15                 # max processing rate per pipeline (CPU cap)

eye:
  method: facemesh        # facemesh (webcam, whole face) | closeup (ESP32 ~3 cm from one eye)
  calibration_s: 5.0      # record the open-eye baseline this long at start (and on POST /calibrate/eye)
  default_baseline: 0.28  # EAR used until calibration finishes
  blink_ratio: 0.65       # EAR / baseline below this = eye closed
  blink_min_s: 0.05       # a closure this short is noise
  blink_max_s: 0.5        # a closure this long is not a blink (eyes shut, looking down)
  squint_low: 0.65        # squint = EAR / baseline between squint_low and squint_high...
  squint_high: 0.85
  squint_min_s: 1.5       # ...for at least this long
  rate_window_s: 60       # blinks per minute over this window

distance:
  method: face            # face (camera sees a person: webcam demo) | object (camera sees the screen)
  device: laptop          # laptop | phone: picks the too-close threshold
  too_close_cm:
    laptop: 50
    phone: 30
  face_width_cm: 14.0     # cheek-to-cheek width of an average adult face
  object_width_cm: 30.0   # real width of the screen for method: object (13" laptop screen ~29 cm)
  focal_px: null          # set by POST /calibrate/distance; null = estimate from hfov_deg
  hfov_deg: 65            # webcam horizontal field of view, used until calibrated
  smoothing: 0.3          # exponential smoothing factor for the cm value (1 = none)

rear:
  flip: true              # rear camera: image-left = wearer's right
  cooldown_s: 4.0         # minimum time between spoken warnings
  speech: auto            # auto (macOS say, else pyttsx3, else print) | say | pyttsx3 | print | off
  message: "Object approaching from behind"
  lgmd:                   # LGMD params, same names and defaults as lgmd.py
    p_min: 10
    w_shift: 1
    k_thresh: 3000
    f_max: 80000
    n_rise: 3
  yolo:
    enabled: false        # needs: pip install ultralytics
    model: yolov8n.pt
    min_conf: 0.4

app_bridge:               # speak mobile-app's UDP protocol so Aman's app shows live backend data
  enabled: true
  phone_ip: 127.0.0.1     # iOS simulator: 127.0.0.1; real phone on its hotspot: 172.20.10.1
  mjpeg_port: 81          # serve the rear camera here (the app's rear view expects :81/stream); null = off

api:
  host: 0.0.0.0
  port: 8000

db:
  path: backend/data/mega.db
  sample_every_s: 1.0

recommendations:
  low_blink_per_min: 10   # healthy is ~15-20 at rest, it drops a lot while staring at screens
  too_close_minutes: 5    # too close for this many of the last 15 minutes
  session_minutes: 20     # 20-20-20 reminder after this long without a break
  break_s: 20             # face away from the camera this long = a break

screentime:
  mac_tracker: true       # log the Mac's frontmost app every few seconds (real data, no permissions)
  poll_s: 5

obs:
  host: localhost
  port: 4455
  password: ""
  scene_mac: "Mac Webcam"
  scene_glasses: "Glasses POV"
