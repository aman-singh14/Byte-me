# Backend config: THE PRODUCT.
#
#   EYE    ESP32-CAM ~3 cm from one eye, JPEG frames over UDP   -> close-up pupil tracking
#   FRONT  ESP32-CAM looking outward, JPEG frames over UDP      -> distance to screen, "what am I looking at?"
#   REAR   OV2640 on the FPGA; LGMD runs in hardware and sends EVENT + last 3 s of video
#          over docs/rear_event_protocol.md                 -> classify + warn
#
# No laptop webcam is part of the product. Development stand-ins (webcam, still images,
# mock FPGA) live in config.dev.yaml: python -m backend.main --dev
#
# A camera "source" is udp://<camera>:<port> (backend/udp_camera.py) or an MJPEG URL. If a stream is down there is no fallback here:
# the dashboard shows "EYE camera offline" and the reader retries every reconnect_s.
# (Sources can also be a webcam index, a video/image file or "synthetic"; those are for dev.)

cameras:
  eye:
    source: "udp://eye-cam.local:81"
    stream_port: 81       # EYE live video, UDP 81 (also MJPEG at http://<ip>:81/stream): 320x240 grey, 25 fps
    static_ip: null       # e.g. 172.20.10.3 if mDNS doesn't resolve on the hotspot (the hello usually makes this unnecessary)
    fallback: null
    fps: 25               # 320x240 at ~20-25 fps: frame rate matters more than detail for blinks
  front:
    source: "udp://front-cam.local:81"
    stream_port: 81       # FRONT live video, UDP 81 (also MJPEG at http://<ip>:81/stream): 640x480 colour, 5 fps
    static_ip: null
    fallback: null
    fps: 3                # 640x480 stream, analysed ~3 times a second (YOLO near-work + brightness)
    still_size: uxga      # one 1600x1200 /capture still, on demand only ("what am I looking at?": YOLO + Muse)
  # BACK camera (firmware/esp_camera3_back): UDP 4300, its own video + status format; the backend does
  # not read it yet (its rear receiver below also uses UDP 4300 and skips those packets).
  # For rear.mode: software, add  rear: {source: "<MJPEG URL>"}

discovery:
  port: 4310              # ESP32s broadcast {"t":"cam_hello","role":...,"ip":...} here every 2 s

stream:
  reconnect_s: 3.0        # retry a dead source this often
  stale_s: 2.0            # no new frame for this long = source is down
  width: 640              # requested capture size (webcam stand-ins only; ESP32 size is set in firmware)
  height: 480

pipelines:
  fps: 15                 # max processing rate per pipeline (CPU cap)

eye:
  method: closeup         # closeup: dark-pupil tracking, camera ~3 cm from one eye (the product)
                          # facemesh: DEV ONLY, whole face on a laptop webcam
  calibration_s: 5.0      # record the open-eye baseline this long at start (and on POST /calibrate/eye)
  default_baseline: 1.0   # openness used until calibration finishes (closeup: visible pupil area / full)
  blink_ratio: 0.65       # openness / baseline below this = eye closed (pupil mostly or fully covered)
  blink_min_s: 0.08       # a blink = eye closed for 80..450 ms, whatever the frame rate
  blink_max_s: 0.45       # (at 20-25 fps that is 2..11 frames; longer = eyes shut, not a blink)
  blink_min_frames: null  # set both to count blinks in frames instead of seconds
  blink_max_frames: null
  pupil_locator: mass     # gaze position from the blurry-frame locator (backend/pupil.py); "blob" = round-blob finder
  presence_s: 2.0         # no pupil for longer than this = eye not in view (not a closed eye)
  partial_ratio: 0.85     # partial blink: lid dips below this (but not below blink_ratio), blink-length
  low_blink_per_min: 10   # flag a low-blink stretch: under this rate...
  low_blink_min_s: 300    # ...for at least 5 minutes
  squint_low: 0.65        # squint = openness / baseline between squint_low and squint_high...
  squint_high: 0.85
  squint_min_s: 1.5       # ...for at least this long
  rate_window_s: 60       # blinks per minute over this window

nearwork:                 # FRONT camera near-work (backend/nearwork.py): YOLO laptop/phone/tv/keyboard/book
  too_close_cm:           # close-up = nearer than this (per COCO label)
    cell phone: 30
    book: 30
    laptop: 50
    tv: 50
    keyboard: 50
  session_gap_s: 5        # a missed detection shorter than this doesn't split a session
  switch_s: 5             # another object closer for this long starts a new session
  min_session_s: 10       # shorter close-ups are glances, not sessions

rings:
  heads_up_after_s: 20    # no near-work in view this long = heads-up
  heads_up_goal_min: 180
  outside_goal_min: 120
  min_break_s: 60         # heads-up stretches this long earn points
  points:
    heads_up_break: 5
    outside_per_5min: 1
    ring_complete: 20

outdoor:                  # backend/outdoor.py: brightness = luma / (exposure x gain), from /sensor
  threshold_log: 0.0      # log10 brightness; set by POST /outdoor/calibrate (indoor + outdoor)
  hysteresis_log: 0.25
  hold_s: 60              # sustained this long to switch indoor <-> outdoor
  sky_boost_log: 0.2      # lower the threshold this much when the top third looks like sky
  sky_min_fraction: 0.3

distance:
  method: nearwork        # nearwork: nearest near-work object (the product)
                          # face: DEV ONLY, face width when a webcam looks at you
  device: laptop          # laptop | phone: picks the reference width and the too-close threshold
  too_close_cm:
    laptop: 50
    phone: 30
  object_width_cm:        # real width of the screen you look at
    laptop: 30.0          # 13-14" laptop screen
    phone: 7.0            # phone held upright
  face_width_cm: 14.0     # DEV ONLY (method: face)
  focal_px: null          # set by POST /calibrate/distance; null = estimate from hfov_deg
  hfov_deg: 65            # front camera horizontal field of view, used until calibrated
  smoothing: 0.3          # exponential smoothing factor for the cm value (1 = none)

speech:                   # everything the glasses say (backend/speech.py)
  laptop: auto            # auto (macOS say -> Bluetooth earbuds/speaker), say, pyttsx3, print (silent), off
  browser: true           # also send "speak" events so the dashboard/app speaks on the phone
  rate: null              # words per minute for `say` (null = default)
  esp32: false            # future MAX98357A I2S speaker on an ESP32 (not built)

gaze:                     # backend/gaze.py: LEFT / CENTER / RIGHT from the pupil
  calibration_step_s: 3.0 # "look left / straight ahead / right", this long each
  settle_s: 0.5           # skip the start of each step while the eye moves
  smoothing_s: 0.5        # majority vote over this window
  hysteresis: 0.15        # switch only if clearly closer (fraction of the left-right span)
  y_weight: 1.0           # up/down counts as much as left/right (the real eye camera is below the eye,
                          # so looking left also moves the pupil down: left vs center differ mostly in y)
  front_mirrored: false   # the FRONT camera faces where the wearer faces (dev webcam: true)
  regions:                # FRONT frame columns per gaze region (0 = left edge, 1 = right), ~15% overlap
    left: [0.0, 0.41]
    center: [0.26, 0.74]
    right: [0.59, 1.0]
  default_centroids:      # pupil (x, y) per region until calibrated (sign depends on the camera mount)
    left: [-0.25, 0.0]
    center: [0.0, 0.0]
    right: [0.25, 0.0]

vision:                   # local object detection (backend/vision.py)
  model: yolov8n.pt       # in backend/models/ (downloaded on first use)
  min_conf: 0.35

muse:                     # Meta Muse Spark via the Model API (backend/muse_client.py)
  enabled: true           # key: MUSE_API_KEY in .env (gitignored)
  base_url: https://api.meta.ai/v1
  model: muse-spark-1.3   # same price as 1.1 / 1.2; any Muse Spark ID works here
  max_tokens: 300         # hidden reasoning uses ~60-90 of these before the answer
  reasoning_effort: minimal
  timeout_s: 20
  lifetime_cap_usd: 10.0  # hard stop: no call once this much is spent (incl. prior_spend_usd)
  daily_cap_usd: 5.0
  max_calls_per_min: 6
  prior_spend_usd: 0.0033 # calls made before this database (2 key checks + 1 whose log was reset)
  image_max_side: 1024    # frames are downscaled + JPEG'd before sending (more detail for small objects and text)
  image_quality: 80
  price_per_mtok:         # Standard tier, from Meta's pricing page
    input: 1.25
    cached_input: 0.15
    output: 4.25

rear:
  mode: fpga              # fpga: events from the FPGA (the product) | software: lgmd.py on a rear stream
  flip: true              # rear camera: image-left = wearer's right
  cooldown_s: 4.0         # minimum time between spoken generic warnings
  fpga:                   # rear.mode: fpga (backend/rear/, docs/rear_event_protocol.md)
    transports: [udp]     # udp (ESP32 bridge or tools/mock_fpga.py) and/or serial (USB from the FPGA)
    udp_port: 4300
    serial_port: null     # e.g. /dev/tty.usbserial-XXXX (Tang Nano 20K), or --rear-serial
    baud: 921600
    gap_timeout_s: 1.0    # no packet for this long: classify whatever arrived
    clip_timeout_s: 10.0  # never wait longer than this after EVENT
    tau_danger_s: 4.0     # time to contact below this = approaching fast
    min_growth: 1.3       # or the object grew this much over the clip
    say_false_alarm: true # follow a false alarm with "Never mind, nothing dangerous"
    muse_followup: false  # send one frame of dangerous events to Muse (dashboard text only)
    save_clips: true      # backend/data/clips/event_*.npz
  speech: auto            # standalone `python -m backend.rear_alert` only; the backend uses `speech`
  message: "Something approaching from behind"
  lgmd:                   # rear.mode: software only. Same names and defaults as lgmd.py
    p_min: 10
    w_shift: 1
    k_thresh: 3000
    f_max: 80000
    n_rise: 3
  yolo:
    enabled: false        # rear.mode: software: name the approaching object
    model: yolov8n.pt
    min_conf: 0.4

app_bridge:               # speak mobile-app's UDP protocol so Aman's app shows live backend data
  enabled: true
  phone_ip: 127.0.0.1     # iOS simulator: 127.0.0.1; real phone on its hotspot: 172.20.10.1
  mjpeg_port: 81          # serve the rear camera here (rear.mode: software only); null = off

api:
  host: 0.0.0.0
  port: 8001              # camera backend; Together uses 8000

db:
  path: backend/data/mega.db
  sample_every_s: 1.0

recommendations:
  low_blink_per_min: 10   # healthy is ~15-20 at rest, it drops a lot while staring at screens
  too_close_minutes: 5    # too close for this many of the last 15 minutes
  session_minutes: 20     # 20-20-20 reminder after this long without a break
  break_s: 20             # no eye/screen in view this long = a break

screentime:
  mac_tracker: true       # log the Mac's frontmost app every few seconds (real data, no permissions)
  poll_s: 5

obs:                      # FaceTime switch: "Mac Webcam" is the Mac's own camera we switch AWAY from
  host: localhost
  port: 4455
  password: ""
  scene_mac: "Mac Webcam"
  scene_glasses: "Glasses POV"
