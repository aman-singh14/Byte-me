# Mega Glasses backend config: THE PRODUCT.
#
#   EYE    ESP32-CAM ~3 cm from one eye, MJPEG over Wi-Fi   -> close-up pupil tracking
#   FRONT  ESP32-CAM looking outward, MJPEG over Wi-Fi      -> distance to screen, "what am I looking at?"
#   REAR   OV2640 on the FPGA; LGMD runs in hardware and sends EVENT + last 3 s of video
#          over docs/rear_event_protocol.md                 -> classify + warn
#
# No laptop webcam is part of the product. Development stand-ins (webcam, still images,
# mock FPGA) live in config.dev.yaml: python -m backend.main --dev
#
# A camera "source" is an MJPEG URL. If a stream is down there is no fallback here:
# the dashboard shows "EYE camera offline" and the reader retries every reconnect_s.
# (Sources can also be a webcam index, a video/image file or "synthetic"; those are for dev.)

cameras:
  eye:
    source: "http://eye-cam.local:81/stream"
    fallback: null
  front:
    source: "http://front-cam.local:81/stream"
    fallback: null
  # The rear camera does not stream: it arrives as FPGA events (rear.mode: fpga).
  # For rear.mode: software, add  rear: {source: "<MJPEG URL>"}

stream:
  reconnect_s: 3.0        # retry a dead source this often
  stale_s: 2.0            # no new frame for this long = source is down
  width: 640              # requested capture size (webcam stand-ins only; ESP32 size is set in firmware)
  height: 480

pipelines:
  fps: 15                 # max processing rate per pipeline (CPU cap)

eye:
  method: closeup         # closeup: dark-pupil tracking, camera ~3 cm from one eye (the product)
                          # facemesh: DEV ONLY, whole face on a laptop webcam
  calibration_s: 5.0      # record the open-eye baseline this long at start (and on POST /calibrate/eye)
  default_baseline: 1.0   # openness used until calibration finishes (closeup: visible pupil area / full)
  blink_ratio: 0.65       # openness / baseline below this = eye closed (pupil mostly or fully covered)
  blink_min_frames: 2     # a blink = closed for 2..7 frames (at the eye camera's ~10-20 fps)
  blink_max_frames: 7
  blink_min_s: 0.05       # used only when blink_*_frames are null (dev webcam)
  blink_max_s: 0.5
  presence_s: 2.0         # no pupil for longer than this = eye not in view (not a closed eye)
  squint_low: 0.65        # squint = openness / baseline between squint_low and squint_high...
  squint_high: 0.85
  squint_min_s: 1.5       # ...for at least this long
  rate_window_s: 60       # blinks per minute over this window

distance:
  method: object          # object: known width of the screen/device in the FRONT frame (the product)
                          # face: DEV ONLY, face width when a webcam looks at you
  device: laptop          # laptop | phone: picks the reference width and the too-close threshold
  too_close_cm:
    laptop: 50
    phone: 30
  object_width_cm:        # real width of the screen you look at
    laptop: 30.0          # 13-14" laptop screen
    phone: 7.0            # phone held upright
  face_width_cm: 14.0     # DEV ONLY (method: face)
  focal_px: null          # set by POST /calibrate/distance; null = estimate from hfov_deg
  hfov_deg: 65            # front camera horizontal field of view, used until calibrated
  smoothing: 0.3          # exponential smoothing factor for the cm value (1 = none)

rear:
  mode: fpga              # fpga: events from the FPGA (the product) | software: lgmd.py on a rear stream
  flip: true              # rear camera: image-left = wearer's right
  cooldown_s: 4.0         # minimum time between spoken warnings
  speech: auto            # auto (macOS say, else pyttsx3, else print) | say | pyttsx3 | print | off
  message: "Object approaching from behind"
  lgmd:                   # rear.mode: software only. Same names and defaults as lgmd.py
    p_min: 10
    w_shift: 1
    k_thresh: 3000
    f_max: 80000
    n_rise: 3
  yolo:
    enabled: false        # rear.mode: software: name the approaching object
    model: yolov8n.pt
    min_conf: 0.4

app_bridge:               # speak mobile-app's UDP protocol so Aman's app shows live backend data
  enabled: true
  phone_ip: 127.0.0.1     # iOS simulator: 127.0.0.1; real phone on its hotspot: 172.20.10.1
  mjpeg_port: 81          # serve the rear camera here (rear.mode: software only); null = off

api:
  host: 0.0.0.0
  port: 8000

db:
  path: backend/data/mega.db
  sample_every_s: 1.0

recommendations:
  low_blink_per_min: 10   # healthy is ~15-20 at rest, it drops a lot while staring at screens
  too_close_minutes: 5    # too close for this many of the last 15 minutes
  session_minutes: 20     # 20-20-20 reminder after this long without a break
  break_s: 20             # no eye/screen in view this long = a break

screentime:
  mac_tracker: true       # log the Mac's frontmost app every few seconds (real data, no permissions)
  poll_s: 5

obs:                      # FaceTime switch: "Mac Webcam" is the Mac's own camera we switch AWAY from
  host: localhost
  port: 4455
  password: ""
  scene_mac: "Mac Webcam"
  scene_glasses: "Glasses POV"
