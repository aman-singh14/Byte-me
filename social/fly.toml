# Fly.io config for the social server. See social/README.md for the steps.
# "app" must be unique on Fly: change it if the name is taken.
app = "omni-glasses-social"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  SOCIAL_DB = "/data/social.db"

# SQLite lives on a volume, so data survives deploys and restarts.
[[mounts]]
  source = "social_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Sleeps when idle and wakes on the first request (a second or two).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  method = "GET"
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
